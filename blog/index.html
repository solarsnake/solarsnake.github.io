<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — tippens@portfolio</title>

    <!-- Open Graph / Twitter Card -->
    <meta property="og:type"        content="blog">
    <meta property="og:title"       content="Blog — tippens@portfolio">
    <meta property="og:description" content="Writing on cloud infrastructure, DevOps, AI/ML, and engineering culture by Timothy Tippens.">
    <meta property="og:url"         content="https://justthetipp.com/blog/index.html">
    <meta property="og:site_name"   content="tippens@portfolio">
    <meta name="twitter:card"       content="summary">
    <meta name="twitter:title"      content="Blog — tippens@portfolio">
    <meta name="twitter:description" content="Writing on cloud infrastructure, DevOps, AI/ML, and engineering culture.">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #00ff00;
            --green-dim: #00cc00;
            --green-muted: #008800;
            --green-dark: #004400;
            --cyan: #00ffcc;
            --bg: #000000;
            --bg-card: #0d0d0d;
            --bg-card-hover: #111111;
            --bg-nav: #0a0a0a;
            --border: #1a3a1a;
            --border-active: #00aa00;
            --text: #00cc00;
            --text-dim: #008800;
            --font-mono: 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--green-muted); border-radius: 3px; }

        /* Nav */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(4px);
        }

        .site-nav .brand {
            color: var(--green);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .site-nav .brand span { color: var(--text-dim); }

        .nav-links { display: flex; gap: 1.5rem; list-style: none; }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.15s;
        }

        .nav-links a:hover { color: var(--green); }
        .nav-links a.active { color: var(--green); }

        /* Main layout */
        .page-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* Header */
        .blog-header {
            padding: 2rem 0 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .blog-header h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: var(--green);
            letter-spacing: 0.02em;
        }

        .blog-header h1 span { color: var(--text-dim); }

        .blog-header p {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-top: 0.4rem;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }

        .search-wrap {
            flex: 1;
            min-width: 180px;
            position: relative;
        }

        .search-wrap::before {
            content: '>';
            position: absolute;
            left: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--green-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--green);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 0.45rem 0.6rem 0.45rem 1.4rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-input::placeholder { color: var(--text-dim); }
        .search-input:focus { border-color: var(--border-active); }

        .tag-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .tag-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 0.25rem 0.55rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tag-btn:hover { border-color: var(--green-muted); color: var(--green); }

        .tag-btn.active {
            background: var(--green-dark);
            border-color: var(--green-muted);
            color: var(--green);
        }

        /* Post count */
        .post-count {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        /* Post grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* Post card */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: border-color 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
        }

        .post-card:hover { border-color: var(--border-active); background: var(--bg-card-hover); }
        .post-card.expanded { border-color: var(--green); grid-column: 1 / -1; }

        .card-header {
            padding: 1rem 1.1rem 0.75rem;
            cursor: pointer;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.4rem;
        }

        .post-date {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .post-tag {
            font-size: 0.65rem;
            color: var(--green-muted);
            border: 1px solid var(--green-dark);
            padding: 0.1rem 0.35rem;
        }

        .post-title {
            font-size: 0.95rem;
            color: var(--green);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .post-excerpt {
            font-size: 0.78rem;
            color: var(--text-dim);
            line-height: 1.55;
        }

        .card-actions {
            padding: 0.6rem 1.1rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .read-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0;
            transition: color 0.15s;
        }

        .read-btn:hover { color: var(--green); }
        .read-btn.open { color: var(--cyan); }

        /* Full post content */
        .post-full {
            display: none;
            padding: 1rem 1.1rem 1.2rem;
            border-top: 1px solid var(--border);
        }

        .post-full.visible { display: block; }

        .post-full .md-content {
            font-size: 0.82rem;
            line-height: 1.8;
            color: var(--text);
        }

        .md-content p { margin-bottom: 1rem; }
        .md-content p:last-child { margin-bottom: 0; }

        .md-content h1, .md-content h2, .md-content h3 {
            color: var(--green);
            margin: 1.2rem 0 0.6rem;
        }

        .md-content strong { color: var(--green); }
        .md-content em { color: #39ff14; font-style: italic; }

        .md-content blockquote {
            border-left: 3px solid var(--green-muted);
            padding-left: 0.8rem;
            margin: 0.8rem 0;
            color: var(--text-dim);
            font-style: italic;
        }

        .md-content blockquote p { margin-bottom: 0.4rem; }

        .md-content code {
            background: #0a0a0a;
            border: 1px solid var(--border);
            padding: 0.15rem 0.35rem;
            font-size: 0.8em;
        }

        .md-content pre {
            background: #0a0a0a;
            border: 1px solid var(--border);
            padding: 0.75rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        .md-content pre code { border: none; padding: 0; }

        .md-content a { color: var(--cyan); }
        .md-content ul, .md-content ol { margin: 0.5rem 0 1rem 1.2rem; }
        .md-content li { margin-bottom: 0.3rem; }

        .close-post {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-mono);
            padding: 0;
        }

        .close-post:hover { color: var(--green); }

        /* Loading / Error / Empty */
        .status-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .status-msg .blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Back to top */
        #back-top {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s, color 0.15s, border-color 0.15s;
            pointer-events: none;
        }

        #back-top.visible { opacity: 1; pointer-events: auto; }
        #back-top:hover { color: var(--green); border-color: var(--green-muted); }

        /* No results */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .site-nav { flex-direction: column; gap: 0.5rem; }
            .controls { flex-direction: column; }
            .posts-grid { grid-template-columns: 1fr; }

            /* Touch-friendly tap targets */
            .tag-btn {
                font-size: 0.78rem;
                padding: 0.45rem 0.7rem;
                min-height: 36px;
            }
            .search-input {
                font-size: 0.85rem;
                padding: 0.55rem 0.6rem 0.55rem 1.5rem;
                min-height: 36px;
            }
            .read-btn {
                font-size: 0.8rem;
                padding: 0.3rem 0;
                min-height: 36px;
                display: flex;
                align-items: center;
            }
            .post-title { font-size: 1rem; }
            .card-header { padding: 0.9rem 1rem 0.7rem; }
        }
    </style>
</head>
<body>

<nav class="site-nav">
    <div class="brand">tippens@portfolio<span>:/blog</span>$</div>
    <ul class="nav-links">
        <li><a href="../index.html">~/terminal</a></li>
        <li><a href="../resume.html">~/resume</a></li>
        <li><a href="index.html" class="active">~/blog</a></li>
        <li><a href="../contact.html">~/contact</a></li>
    </ul>
</nav>

<div class="page-wrap">
    <header class="blog-header">
        <h1>Learning to Count Sheep <span>// blog</span></h1>
        <p>Thoughts on technology, philosophy, and the human condition.</p>
    </header>

    <div class="controls">
        <div class="search-wrap">
            <input type="text" class="search-input" id="search" placeholder="search posts..." autocomplete="off" spellcheck="false">
        </div>
        <div class="tag-filters" id="tag-filters">
            <button class="tag-btn active" data-tag="all">#all</button>
        </div>
    </div>

    <div class="post-count" id="post-count"></div>

    <div id="posts-container">
        <div class="status-msg"><span class="blink">_</span> loading posts...</div>
    </div>
</div>

<button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">^ top</button>

<script>
    // Config
    const GITHUB_RAW = 'https://raw.githubusercontent.com/solarsnake/solarsnake.github.io/terminal/posts/index.json';
    const LOCAL_FALLBACK = '../posts/index.json';

    let allPosts = [];
    let activeTag = 'all';
    let searchQuery = '';
    let expandedSlug = null;

    // Fetch posts with raw GitHub URL for near-real-time, fall back to local
    async function fetchPosts() {
        const urls = [GITHUB_RAW, LOCAL_FALLBACK];
        for (const url of urls) {
            try {
                const res = await fetch(url + '?_=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) continue;
                const data = await res.json();
                return data.posts.filter(p => p.published !== false);
            } catch (e) {
                // Try next URL
            }
        }
        return null;
    }

    function slugify(text) {
        return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr + 'T12:00:00');
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function allTags(posts) {
        const tags = new Set();
        posts.forEach(p => (p.tags || []).forEach(t => tags.add(t)));
        return Array.from(tags).sort();
    }

    function buildTagFilters(posts) {
        const container = document.getElementById('tag-filters');
        const tags = allTags(posts);
        // Keep #all button
        const allBtn = container.querySelector('[data-tag="all"]');
        container.innerHTML = '';
        container.appendChild(allBtn);
        tags.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'tag-btn';
            btn.dataset.tag = tag;
            btn.textContent = '#' + tag;
            btn.addEventListener('click', () => setTag(tag));
            container.appendChild(btn);
        });
    }

    function setTag(tag) {
        activeTag = tag;
        document.querySelectorAll('.tag-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tag === tag);
        });
        renderPosts();
    }

    function filterPosts() {
        return allPosts.filter(post => {
            const matchesTag = activeTag === 'all' || (post.tags || []).includes(activeTag);
            const q = searchQuery.toLowerCase();
            const matchesSearch = !q ||
                post.title.toLowerCase().includes(q) ||
                post.excerpt.toLowerCase().includes(q) ||
                (post.content || '').toLowerCase().includes(q) ||
                (post.tags || []).some(t => t.includes(q));
            return matchesTag && matchesSearch;
        });
    }

    function renderPosts() {
        const filtered = filterPosts();
        const container = document.getElementById('posts-container');
        const countEl = document.getElementById('post-count');

        countEl.textContent = `${filtered.length} post${filtered.length !== 1 ? 's' : ''} found`;

        if (filtered.length === 0) {
            container.innerHTML = '<div class="posts-grid"><div class="no-results">no posts match your query.<br><br><span style="color:var(--green-muted)">try a different search or tag.</span></div></div>';
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'posts-grid';

        filtered.forEach(post => {
            const card = createCard(post);
            grid.appendChild(card);
        });

        container.innerHTML = '';
        container.appendChild(grid);
    }

    function createCard(post) {
        const isExpanded = expandedSlug === post.slug;
        const card = document.createElement('article');
        card.className = 'post-card' + (isExpanded ? ' expanded' : '');
        card.dataset.slug = post.slug;

        const tagsHtml = (post.tags || []).map(t =>
            `<span class="post-tag">#${t}</span>`
        ).join('');

        card.innerHTML = `
            <div class="card-header" role="button" tabindex="0" aria-expanded="${isExpanded}">
                <div class="card-meta">
                    <span class="post-date">${formatDate(post.date)}</span>
                </div>
                <div class="post-tags" style="margin-bottom:0.5rem">${tagsHtml}</div>
                <h2 class="post-title">${escapeHtml(post.title)}</h2>
                <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
            </div>
            <div class="card-actions">
                <button class="read-btn ${isExpanded ? 'open' : ''}">${isExpanded ? '[ collapse ]' : '[ read more ]'}</button>
                <span style="font-size:0.7rem;color:var(--text-dim)">${(post.content || '').split(' ').length} words</span>
            </div>
            <div class="post-full ${isExpanded ? 'visible' : ''}">
                <div class="md-content">${marked.parse(post.content || '')}</div>
                <button class="close-post">^ collapse</button>
            </div>
        `;

        const toggle = () => {
            if (expandedSlug === post.slug) {
                expandedSlug = null;
            } else {
                expandedSlug = post.slug;
            }
            renderPosts();
            if (expandedSlug) {
                setTimeout(() => {
                    const el = document.querySelector(`[data-slug="${expandedSlug}"]`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 50);
            }
        };

        card.querySelector('.card-header').addEventListener('click', toggle);
        card.querySelector('.card-header').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') toggle(); });
        card.querySelector('.read-btn').addEventListener('click', e => { e.stopPropagation(); toggle(); });
        const closeBtn = card.querySelector('.close-post');
        if (closeBtn) closeBtn.addEventListener('click', e => { e.stopPropagation(); toggle(); });

        return card;
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Search debounce
    let searchTimer;
    document.getElementById('search').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchQuery = e.target.value.trim();
            renderPosts();
        }, 200);
    });

    // Tag filter click (for #all)
    document.getElementById('tag-filters').addEventListener('click', e => {
        if (e.target.dataset.tag === 'all') setTag('all');
    });

    // Back to top
    const backTop = document.getElementById('back-top');
    window.addEventListener('scroll', () => {
        backTop.classList.toggle('visible', window.scrollY > 400);
    });

    // Init
    (async () => {
        const posts = await fetchPosts();
        if (!posts) {
            document.getElementById('posts-container').innerHTML =
                '<div class="status-msg">error loading posts. check back soon.</div>';
            return;
        }

        allPosts = posts.sort((a, b) => new Date(b.date) - new Date(a.date));
        buildTagFilters(allPosts);
        renderPosts();

        // Handle #slug in URL to auto-expand a post
        const hash = location.hash.slice(1);
        if (hash) {
            const post = allPosts.find(p => p.slug === hash);
            if (post) {
                expandedSlug = hash;
                renderPosts();
            }
        }
    })();
</script>
</body>
</html>
